<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facturas - Gestión de Canchas</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">

    <style>
        .factura-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .factura-icono {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(25, 135, 84, 0.22);
            color: #69ca8d;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .factura-info strong {
            display: block;
            color: white;
            font-size: 0.9rem;
        }

        .pago-referencia {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #d9e0e5;
        }

        .fecha-factura {
            color: #aab4bc;
        }
    </style>

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-modulo">

    <section class="encabezado-modulo">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>

                <h1>
                    <i class="fa-solid fa-file-invoice-dollar me-2"></i>
                    Facturas
                </h1>

                <p>
                    Administración y consulta de las facturas registradas en el sistema.
                </p>

            </div>

            <a th:if="${session.usuario != null and session.usuario.rol == 'ADMIN'}"
            th:href="@{/facturas/nuevo}"
               class="btn btn-nuevo">

                <i class="fa-solid fa-plus me-2"></i>
                Nueva factura

            </a>

        </div>

    </section>

    <section class="panel-tabla">

        <div class="panel-superior">

            <h2>
                <i class="fa-solid fa-file-invoice me-2 text-success"></i>
                Facturas registradas
            </h2>

            <span class="total-registros">

                <i class="fa-solid fa-database me-1"></i>

                Total:
                <strong th:text="${#lists.size(facturas)}">0</strong>

            </span>

        </div>

        <div class="table-responsive">

            <table class="table tabla-modulo align-middle">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Pago</th>
                        <th>Número de factura</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="factura : ${facturas}">

                        <td>

                            <span class="text-secondary">
                                #<span th:text="${factura.idFactura}">1</span>
                            </span>

                        </td>

                        <td>

                            <span class="pago-referencia">

                                <i class="fa-solid fa-money-bill-wave text-secondary"></i>

                                Pago #<span th:text="${factura.idPago}">1</span>

                            </span>

                        </td>

                        <td>

                            <div class="factura-info">

                                <div class="factura-icono">
                                    <i class="fa-solid fa-file-invoice-dollar"></i>
                                </div>

                                <strong th:text="${factura.numeroFactura}">
                                    FAC-001
                                </strong>

                            </div>

                        </td>

                        <td>

                            <span class="fecha-factura">

                                <i class="fa-solid fa-calendar-days me-2"></i>

                                <span th:text="${factura.fechaFactura}">
                                    2026-07-21
                                </span>

                            </span>

                        </td>

                        <td>

                            <span th:if="${factura.idEstado == 1}"
                                  class="badge-estado">

                                <i class="fa-solid fa-circle-check"></i>
                                Activo

                            </span>

                            <span th:if="${factura.idEstado == 2}"
                                  class="badge-secundario">

                                <i class="fa-solid fa-circle-minus"></i>
                                Inactivo

                            </span>

                            <span th:if="${factura.idEstado != 1 && factura.idEstado != 2}"
                                  class="badge-secundario">

                                <i class="fa-solid fa-circle-info"></i>

                                Estado
                                <span th:text="${factura.idEstado}"></span>

                            </span>

                        </td>

                        <td class="text-center">

                            <a th:href="@{/facturas/imprimir/{id}(id=${factura.idFactura})}"
                               class="btn-accion btn-ver"
                               title="Ver e imprimir factura">

                                <i class="fa-solid fa-print"></i>

                            </a>

                            <a th:if="${session.usuario != null and session.usuario.rol == 'ADMIN'}"
                            th:href="@{/facturas/editar/{id}(id=${factura.idFactura})}"
                               class="btn-accion btn-editar"
                               title="Editar factura">

                                <i class="fa-solid fa-pen"></i>

                            </a>

                            <a th:if="${session.usuario != null and session.usuario.rol == 'ADMIN'}"
                            th:href="@{/facturas/eliminar/{id}(id=${factura.idFactura})}"
                               class="btn-accion btn-inactivar"
                               title="Eliminar factura"
                               onclick="return confirm('¿Está seguro de eliminar esta factura?');">

                                <i class="fa-solid fa-trash"></i>

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(facturas)}">

                        <td colspan="6"
                            class="sin-registros">

                            <i class="fa-solid fa-file-invoice-dollar"></i>
                            No hay facturas registradas.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <a th:href="@{/}"
       class="volver-dashboard">

        <i class="fa-solid fa-arrow-left"></i>
        Volver al panel principal

    </a>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
