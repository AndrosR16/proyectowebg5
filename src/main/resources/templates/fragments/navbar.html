<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

    <nav th:fragment="navbar" class="navbar navbar-dark shadow-sm">

        <div class="container-fluid px-4">

            <div class="row w-100 align-items-center">

                <div class="col-4 d-flex justify-content-start">

                    <button class="btn text-white fw-semibold" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#menuLateral">

                        <i class="fa-solid fa-bars me-2"></i>
                        Menú
                    </button>

                </div>

                <div class="col-4 d-flex justify-content-center align-items-center">

                    <img th:src="@{/img/logo.png}" alt="Logo" width="60" height="60"
                        style="width:60px; height:60px; object-fit:contain;" class="me-2">

                    <a class="navbar-brand fw-bold mb-0" th:href="@{/}">
                        Gestión de Canchas G5
                    </a>

                </div>

                <div class="col-4 d-flex justify-content-end align-items-center">

<span class="text-white fw-bold me-3" th:if="${session.usuario != null}">
    👋 Hola,
    <span th:text="${session.usuario.nombre}">
        Usuario
    </span>

    <br>

    ROL:
    <span th:text="${session.usuario.rol}">
        ROL
    </span>

</span>

                </div>

            </div>

        </div>

    </nav>

</body>

</html>
