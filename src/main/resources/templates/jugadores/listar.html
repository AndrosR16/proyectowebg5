<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jugadores - Gestión de Jugadores</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/offcanvas.css}">
<link rel="stylesheet" th:href="@{/css/dashboard.css}">
<link rel="stylesheet" th:href="@{/css/modulos.css}">

<style>

.jugador-icono{

width:38px;
height:38px;
border-radius:10px;
background:rgba(13,110,253,.22);
color:#6ea8fe;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;

}


.jugador-nombre strong{

display:block;
color:white;
font-size:.9rem;

}


.jugador-nombre span{

color:#98a4ae;
font-size:.78rem;

}

</style>

</head>


<body>


<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/menu :: menu}"></div>



<main class="pagina-modulo">


<section class="encabezado-modulo">


<div class="d-flex justify-content-between align-items-center flex-wrap gap-3">


<div>

<h1>

<i class="fa-solid fa-person-running me-2"></i>

Jugadores

</h1>


<p>

Administración de jugadores registrados.

</p>


</div>



<a

th:if="${session.usuario.rol=='ADMIN'}"

th:href="@{/jugadores/nuevo}"

class="btn btn-nuevo">


<i class="fa-solid fa-plus me-2"></i>

Nuevo jugador


</a>


</div>


</section>





<section class="panel-tabla">


<div class="panel-superior">


<h2>

<i class="fa-solid fa-list me-2 text-success"></i>

Jugadores registrados

</h2>


<span class="total-registros">


<i class="fa-solid fa-database me-1"></i>

Total:

<strong th:text="${#lists.size(jugadores)}">0</strong>


</span>


</div>





<div class="table-responsive">


<table class="table tabla-modulo align-middle">


<thead>


<tr>


<th>ID</th>

<th>Jugador</th>

<th>Cédula</th>

<th>Fecha nacimiento</th>

<th>Dorsal</th>

<th>Posición</th>

<th>Estado</th>


<th

th:if="${session.usuario.rol=='ADMIN'}"

class="text-center">

Acciones

</th>


</tr>


</thead>




<tbody>


<tr th:each="jugador:${jugadores}">



<td>

<span class="text-secondary">

#

<span th:text="${jugador.idJugador}"></span>

</span>

</td>





<td>


<div class="d-flex align-items-center gap-3">


<div class="jugador-icono">

<i class="fa-solid fa-person"></i>

</div>



<div class="jugador-nombre">


<strong

th:text="${jugador.nombre+' '+jugador.apellidoP+' '+jugador.apellidoM}">

</strong>


<span>

Jugador registrado

</span>


</div>


</div>


</td>





<td>

<i class="fa-solid fa-id-card me-2 text-secondary"></i>

<span th:text="${jugador.cedula}"></span>

</td>





<td>

<i class="fa-solid fa-calendar-days me-2 text-secondary"></i>


<span

th:text="${#temporals.format(jugador.fechaNacimiento,'dd/MM/yyyy')}">

</span>


</td>





<td>

<i class="fa-solid fa-shirt me-2 text-secondary"></i>

<span th:text="${jugador.dorsal}"></span>

</td>





<td>


<span class="badge bg-success"

th:text="${jugador.posicion}">

</span>


</td>





<td>

<i class="fa-solid fa-circle-info me-2 text-secondary"></i>

<span th:text="${jugador.estado}">
</span>

</td>





<td

th:if="${session.usuario.rol=='ADMIN'}"

class="text-center">



<a

th:href="@{/jugadores/editar/{id}(id=${jugador.idJugador})}"

class="btn-accion btn-editar"

title="Editar">


<i class="fa-solid fa-pen"></i>


</a>




<form

th:action="@{/jugadores/eliminar/{id}(id=${jugador.idJugador})}"

method="post"

class="d-inline">


<button

type="submit"

class="btn-accion btn-inactivar"

title="Inactivar"

onclick="return confirm('¿Desea inactivar este jugador?')">


<i class="fa-solid fa-ban"></i>


</button>


</form>



</td>


</tr>





<tr th:if="${#lists.isEmpty(jugadores)}">


<td colspan="8" class="sin-registros">


<i class="fa-solid fa-person-running"></i>


No hay jugadores registrados.


</td>


</tr>



</tbody>


</table>


</div>


</section>





<a

th:href="@{/}"

class="volver-dashboard">


<i class="fa-solid fa-arrow-left"></i>


Volver al panel principal


</a>



</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
