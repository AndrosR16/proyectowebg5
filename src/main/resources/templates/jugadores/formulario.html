<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${jugador.idJugador == null ? 'Nuevo jugador' : 'Editar jugador'}">
        Formulario Jugador
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-formulario">

    <section class="encabezado-formulario">

        <h1>

            <i class="fa-solid fa-person-running me-2"></i>

            <span th:text="${jugador.idJugador == null ? 'Nuevo jugador' : 'Editar jugador'}">
                Nuevo jugador
            </span>

        </h1>

        <p th:if="${jugador.idJugador == null}">
            Registrar un nuevo jugador.
        </p>

        <p th:if="${jugador.idJugador != null}">
            Modificar la información del jugador.
        </p>

    </section>


    <section class="panel-formulario">

        <div class="titulo-seccion">

            <i class="fa-solid fa-clipboard-list"></i>

            Información del jugador

        </div>


        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>


        <form th:action="@{/jugadores/guardar}"
              th:object="${jugador}"
              method="post"
              novalidate>

            <!-- Se usa para saber si se crea o se edita -->
            <input type="hidden"
                   th:field="*{idJugador}">


            <div class="row">

                <div class="col-md-12 mb-4">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{nombre}">
                    </div>

                </div>

            </div>


            <div class="row">

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Apellido paterno
                    </label>

                    <input type="text"
                           th:field="*{apellidoP}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('apellidoP')} ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{apellidoP}">
                    </div>

                </div>


                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Apellido materno
                    </label>

                    <input type="text"
                           th:field="*{apellidoM}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('apellidoM')} ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{apellidoM}">
                    </div>

                </div>

            </div>


            <div class="row">

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Cédula
                    </label>

                    <input type="text"
                           th:field="*{cedula}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{cedula}">
                    </div>

                </div>


                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Fecha de nacimiento
                    </label>

                    <input type="date"
                           th:field="*{fechaNacimiento}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{fechaNacimiento}">
                    </div>

                </div>

            </div>


            <div class="row">

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Dorsal
                    </label>

                    <input type="number"
                           th:field="*{dorsal}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('dorsal')} ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{dorsal}">
                    </div>

                </div>


                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Posición
                    </label>

                    <select th:field="*{idPosicion}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('idPosicion')} ? 'is-invalid'">

                        <option value="">
                            Seleccione una posición
                        </option>

                        <option th:each="posicion : ${posiciones}"
                                th:value="${posicion.idPosicion}"
                                th:text="${posicion.descripcion}">
                        </option>

                    </select>

                    <div class="invalid-feedback"
                         th:errors="*{idPosicion}">
                    </div>

                </div>

            </div>


            <div class="row">

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Estado
                    </label>

                    <select th:field="*{idEstado}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('idEstado')} ? 'is-invalid'">

                        <option value="">
                            Seleccione un estado
                        </option>

                        <option th:each="estado : ${estados}"
                                th:value="${estado.idEstado}"
                                th:text="${estado.descripcion}">
                        </option>

                    </select>

                    <div class="invalid-feedback"
                         th:errors="*{idEstado}">
                    </div>

                </div>

            </div>


            <div class="acciones-formulario">

                <a th:href="@{/jugadores}"
                   class="btn btn-cancelar">

                    <i class="fa-solid fa-xmark me-2"></i>

                    Cancelar

                </a>


                <button type="submit"
                        class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    <span th:text="${jugador.idJugador == null ? 'Guardar jugador' : 'Guardar cambios'}">
                        Guardar jugador
                    </span>

                </button>

            </div>

        </form>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
