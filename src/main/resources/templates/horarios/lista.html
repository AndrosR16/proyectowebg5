<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Horarios - Gestión de Canchas</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">

    <style>
        .horario-dia {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(13, 110, 253, 0.17);
            color: #7eb0ff;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 0.77rem;
            font-weight: 600;
        }

        .horario-hora {
            color: #dfe6eb;
            font-weight: 600;
        }

        .horario-cancha {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .horario-cancha-icono {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: rgba(25, 135, 84, 0.22);
            color: #69ca8d;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-modulo">

    <section class="encabezado-modulo">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>
                <h1>
                    <i class="fa-solid fa-clock me-2"></i>
                    Horarios
                </h1>

                <p>
                    Administración de días y horarios disponibles por cancha.
                </p>
            </div>

            <a th:if="${session.usuario != null and session.usuario.rol == 'ADMIN'}"
               th:href="@{/horarios/nuevo}"
               class="btn btn-nuevo">

                <i class="fa-solid fa-plus me-2"></i>
                Nuevo horario

            </a>

        </div>

    </section>

    <section class="panel-tabla">

        <div class="panel-superior">

            <h2>
                <i class="fa-solid fa-calendar-days me-2 text-success"></i>
                Horarios registrados
            </h2>


                        <span class="total-registros">
                <i class="fa-solid fa-database me-1"></i>
                Total:
                <strong th:text="${#lists.size(horarios)}">0</strong>
            </span>

        </div>

        <div class="table-responsive">

            <table class="table tabla-modulo align-middle">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cancha</th>
                        <th>Día</th>
                        <th>Hora inicio</th>
                        <th>Hora fin</th>
                        <th>Estado</th>

                        <th th:if="${session.usuario != null and session.usuario.rol == 'ADMIN'}"
                            class="text-center">
                            Acciones
                        </th>

                    </tr>
                </thead>

                <tbody>

                    <tr th:each="horario : ${horarios}">

                        <td>
                            <span class="text-secondary">
                                #<span th:text="${horario.idHorario}">1</span>
                            </span>
                        </td>

                        <td>
                            <div class="horario-cancha">

                                <div class="horario-cancha-icono">
                                    <i class="fa-solid fa-futbol"></i>
                                </div>

                                <span th:text="${horario.cancha}">
                                    Cancha
                                </span>

                            </div>
                        </td>

                        <td>
                            <span class="horario-dia">

                                <i class="fa-solid fa-calendar-day"></i>

                                <span th:text="${horario.diaSemana}">
                                    Lunes
                                </span>

                            </span>
                        </td>

                        <td>
                            <span class="horario-hora">

                                <i class="fa-regular fa-clock me-2 text-secondary"></i>

                                <span th:text="${horario.horaInicio}">
                                    08:00
                                </span>

                            </span>
                        </td>

                        <td>
                            <span class="horario-hora">

                                <i class="fa-regular fa-clock me-2 text-secondary"></i>

                                <span th:text="${horario.horaFin}">
                                    09:00
                                </span>

                            </span>
                        </td>

                        <td>
                            <span class="badge-estado">

                                <i class="fa-solid fa-circle-check"></i>

                                <span th:text="${horario.estado}">
                                    Activo
                                </span>

                            </span>
                        </td>

                        <td th:if="${session.usuario != null and session.usuario.rol == 'ADMIN'}"
                            class="text-center">

                            <a th:href="@{/horarios/editar/{id}(id=${horario.idHorario})}"
                               class="btn-accion btn-editar"
                               title="Editar horario">

                                <i class="fa-solid fa-pen"></i>

                            </a>

                                                       <div th:if="${horario.idEstado == 1}">

    <form th:action="@{/horarios/estado/{id}/{estado}(id=${horario.idHorario},estado=2)}"
          method="post"
          class="d-inline">

        <button type="submit"
                class="btn-accion btn-inactivar"
                title="Inactivar horario"
                onclick="return confirm('¿Desea inactivar este horario?')">

            <i class="fa-solid fa-ban"></i>

        </button>

    </form>

</div>

<div th:if="${horario.idEstado == 2}">

    <form th:action="@{/horarios/estado/{id}/{estado}(id=${horario.idHorario},estado=1)}"
          method="post"
          class="d-inline">

        <button type="submit"
                class="btn-accion btn-activar"
                title="Activar horario"
                onclick="return confirm('¿Desea activar este horario?')">

            <i class="fa-solid fa-check"></i>

        </button>

    </form>

</div>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(horarios)}">

                        <td th:colspan="${session.usuario != null and session.usuario.rol == 'ADMIN'} ? 7 : 6"
                            class="sin-registros">

                            <i class="fa-solid fa-clock"></i>
                            No hay horarios registrados.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <a th:href="@{/}"
       class="volver-dashboard">

        <i class="fa-solid fa-arrow-left"></i>
        Volver al panel principal

    </a>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
