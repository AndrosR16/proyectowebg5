<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${horario.idHorario == null ? 'Nuevo horario' : 'Editar horario'}">
        Horario
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-formulario">

    <section class="encabezado-formulario">

        <h1>
            <i class="fa-solid fa-clock me-2"></i>

            <span th:text="${horario.idHorario == null ? 'Nuevo horario' : 'Editar horario'}">
                Nuevo horario
            </span>
        </h1>

        <p th:if="${horario.idHorario == null}">
            Registrá un nuevo horario disponible para una cancha.
        </p>

        <p th:if="${horario.idHorario != null}">
            Modificá la información del horario seleccionado.
        </p>

    </section>

    <section class="panel-formulario">

        <div class="titulo-seccion">
            <i class="fa-solid fa-calendar-days"></i>
            Información del horario
        </div>

        <div th:if="${error}"
             class="alert alert-error"
             th:text="${error}">
        </div>

        <form th:action="@{/horarios/guardar}"
              th:object="${horario}"
              method="post"
              novalidate>

            <div class="row">

                

                <div class="col-md-12 mb-4">

                    <label for="idCancha" class="form-label">
                        Cancha
                    </label>

                    <select id="idCancha"
                            th:field="*{idCancha}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('idCancha')} ? ' is-invalid' : ''">

                        <option value="">
                            Seleccione una cancha
                        </option>

                        <option th:each="cancha : ${canchas}"
                                th:value="${cancha.idCancha}"
                                th:text="${cancha.nombreCancha}">
                        </option>

                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('idCancha')}"
                         th:errors="*{idCancha}">
                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-12 mb-4">

                    <label for="diaSemana" class="form-label">
                        Día de la semana
                    </label>

                    <select id="diaSemana"
                            th:field="*{diaSemana}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('diaSemana')} ? ' is-invalid' : ''">

                        <option value="">
                            Seleccione un día
                        </option>

                        <option value="Lunes">Lunes</option>
                        <option value="Martes">Martes</option>
                        <option value="Miércoles">Miércoles</option>
                        <option value="Jueves">Jueves</option>
                        <option value="Viernes">Viernes</option>
                        <option value="Sábado">Sábado</option>
                        <option value="Domingo">Domingo</option>

                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('diaSemana')}"
                         th:errors="*{diaSemana}">
                    </div>

                </div>

                

            </div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="horaInicio" class="form-label">
                        Hora de inicio
                    </label>

                    <input type="time"
                           id="horaInicio"
                           th:field="*{horaInicio}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('horaInicio')} ? ' is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('horaInicio')}"
                         th:errors="*{horaInicio}">
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="horaFin" class="form-label">
                        Hora de fin
                    </label>

                    <input type="time"
                           id="horaFin"
                           th:field="*{horaFin}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('horaFin')} ? ' is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('horaFin')}"
                         th:errors="*{horaFin}">
                    </div>

                </div>

            </div>

            <div class="acciones-formulario">

                <a th:href="@{/horarios}"
                   class="btn btn-cancelar">

                    <i class="fa-solid fa-xmark me-2"></i>
                    Cancelar
                </a>

                <button type="submit"
                        class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    <span th:text="${horario.idHorario == null ? 'Guardar horario' : 'Guardar cambios'}">
                        Guardar horario
                    </span>

                </button>

            </div>

        </form>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
