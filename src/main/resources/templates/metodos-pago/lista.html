<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Métodos de pago - Gestión de Canchas</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">

    <style>
        .metodo-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .metodo-icono {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(25, 135, 84, 0.22);
            color: #69ca8d;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .metodo-info strong {
            display: block;
            color: white;
            font-size: 0.9rem;
        }

        .descripcion-metodo {
            color: #a5afb8;
        }
    </style>

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-modulo">

    <section class="encabezado-modulo">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>

                <h1>
                    <i class="fa-solid fa-credit-card me-2"></i>
                    Métodos de pago
                </h1>

                <p>
                    Administración de los métodos de pago disponibles en el sistema.
                </p>

            </div>

            <a th:href="@{/metodos-pago/nuevo}"
               class="btn btn-nuevo">

                <i class="fa-solid fa-plus me-2"></i>
                Nuevo método

            </a>

        </div>

    </section>

    <section class="panel-tabla">

        <div class="panel-superior">

            <h2>
                <i class="fa-solid fa-wallet me-2 text-success"></i>
                Métodos registrados
            </h2>

            <span class="total-registros">

                <i class="fa-solid fa-database me-1"></i>

                Total:
                <strong th:text="${#lists.size(metodosPago)}">0</strong>

            </span>

        </div>

        <div class="table-responsive">

            <table class="table tabla-modulo align-middle">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Método</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="metodo : ${metodosPago}">

                        <td>

                            <span class="text-secondary">
                                #<span th:text="${metodo.idMetodoPago}">1</span>
                            </span>

                        </td>

                        <td>

                            <div class="metodo-info">

                                <div class="metodo-icono">
                                    <i class="fa-solid fa-credit-card"></i>
                                </div>

                                <strong th:text="${metodo.nombreMetodo}">
                                    Tarjeta
                                </strong>

                            </div>

                        </td>

                        <td>

                            <span class="descripcion-metodo"
                                  th:text="${metodo.descripcion}">
                                Pago mediante tarjeta
                            </span>

                        </td>

                        <td>

                            <th:block th:each="estado : ${estados}">

                                <span th:if="${estado.idEstado == metodo.idEstado and estado.descripcion == 'Activo'}"
                                      class="badge-estado">

                                    <i class="fa-solid fa-circle-check"></i>

                                    <span th:text="${estado.descripcion}">
                                        Activo
                                    </span>

                                </span>

                                <span th:if="${estado.idEstado == metodo.idEstado and estado.descripcion != 'Activo'}"
                                      class="badge-secundario">

                                    <i class="fa-solid fa-circle-minus"></i>

                                    <span th:text="${estado.descripcion}">
                                        Inactivo
                                    </span>

                                </span>

                            </th:block>

                        </td>

                        <td class="text-center">

                            <a th:href="@{/metodos-pago/editar/{id}(id=${metodo.idMetodoPago})}"
                               class="btn-accion btn-editar"
                               title="Editar método de pago">

                                <i class="fa-solid fa-pen"></i>

                            </a>

                            <a th:href="@{/metodos-pago/eliminar/{id}(id=${metodo.idMetodoPago})}"
                               class="btn-accion btn-inactivar"
                               title="Eliminar método de pago"
                               onclick="return confirm('¿Está seguro de eliminar este método de pago?');">

                                <i class="fa-solid fa-trash"></i>

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(metodosPago)}">

                        <td colspan="5"
                            class="sin-registros">

                            <i class="fa-solid fa-credit-card"></i>
                            No hay métodos de pago registrados.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <a th:href="@{/}"
       class="volver-dashboard">

        <i class="fa-solid fa-arrow-left"></i>
        Volver al panel principal

    </a>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
