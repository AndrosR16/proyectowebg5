<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pago.idPago == null ? 'Nuevo pago' : 'Editar pago'}">
        Pago
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-formulario">

    <section class="encabezado-formulario">

        <h1>
            <i class="fa-solid fa-money-bill-wave me-2"></i>

            <span th:text="${pago.idPago == null ? 'Nuevo pago' : 'Editar pago'}">
                Nuevo pago
            </span>
        </h1>

        <p th:if="${pago.idPago == null}">
            Registrá un nuevo pago asociado a una reserva del sistema.
        </p>

        <p th:if="${pago.idPago != null}">
            Modificá la información del pago seleccionado.
        </p>

    </section>

    <section class="panel-formulario">

        <div class="titulo-seccion">
            <i class="fa-solid fa-receipt"></i>
            Información del pago
        </div>

        <form th:action="${pago.idPago == null
                        ? '/pagos/guardar'
                        : '/pagos/actualizar'}"
              th:object="${pago}"
              method="post">

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="idPago" class="form-label">
                        ID del pago
                    </label>

                    <input type="number"
                           id="idPago"
                           class="form-control"
                           th:field="*{idPago}"
                           th:readonly="${pago.idPago != null}"
                           min="1"
                           required>

                    <div class="form-text"
                         th:if="${pago.idPago == null}">
                        El ID debe ser único.
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="idReserva" class="form-label">
                        ID de la reserva
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-calendar-check"></i>
                        </span>

                        <input type="number"
                               id="idReserva"
                               class="form-control"
                               th:field="*{idReserva}"
                               min="1"
                               required>

                    </div>

                    <div class="form-text">
                        Debe ingresar el ID de una reserva existente.
                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="monto" class="form-label">
                        Monto
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            ₡
                        </span>

                        <input type="number"
                               id="monto"
                               class="form-control"
                               th:field="*{monto}"
                               min="0.01"
                               step="0.01"
                               required>

                    </div>

                    <div class="form-text">
                        Ingresá el monto correspondiente al pago.
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="idMetodoPago" class="form-label">
                        Método de pago
                    </label>

                    <select id="idMetodoPago"
                            class="form-select"
                            th:field="*{idMetodoPago}"
                            required>

                        <option value="">
                            Seleccione un método de pago
                        </option>

                        <option th:each="metodo : ${metodosPago}"
                                th:value="${metodo.idMetodoPago}"
                                th:text="${metodo.nombreMetodo}">
                        </option>

                    </select>

                </div>

            </div>

            <div class="mb-4">

                <label for="idEstado" class="form-label">
                    Estado
                </label>

                <select id="idEstado"
                        class="form-select"
                        th:field="*{idEstado}"
                        required>

                    <option value="">
                        Seleccione un estado
                    </option>

                    <option th:each="estado : ${estados}"
                            th:value="${estado.idEstado}"
                            th:text="${estado.descripcion}">
                    </option>

                </select>

                <div class="form-text">
                    Seleccioná el estado actual del pago.
                </div>

            </div>

            <div class="acciones-formulario">

                <a th:href="@{/pagos}"
                   class="btn btn-cancelar">

                    <i class="fa-solid fa-xmark me-2"></i>
                    Cancelar

                </a>

                <button type="submit"
                        class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    <span th:text="${pago.idPago == null
                            ? 'Guardar pago'
                            : 'Actualizar pago'}">
                        Guardar pago
                    </span>

                </button>

            </div>

        </form>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
