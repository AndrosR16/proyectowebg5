<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagos - Gestión de Canchas</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">

    <style>
        .pago-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pago-icono {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(25, 135, 84, 0.22);
            color: #69ca8d;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pago-info strong {
            color: white;
            font-size: 0.9rem;
        }

        .monto-pago {
            color: #71d395;
            font-weight: 700;
        }

        .reserva-pago {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #d9e0e5;
        }
    </style>

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-modulo">

    <section class="encabezado-modulo">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>

                <h1>
                    <i class="fa-solid fa-money-bill-wave me-2"></i>
                    Pagos
                </h1>

                <p>
                    Administración y control de los pagos registrados en el sistema.
                </p>

            </div>

            <a th:href="@{/pagos/nuevo}"
               class="btn btn-nuevo">

                <i class="fa-solid fa-plus me-2"></i>
                Nuevo pago

            </a>

        </div>

    </section>

    <section class="panel-tabla">

        <div class="panel-superior">

            <h2>
                <i class="fa-solid fa-receipt me-2 text-success"></i>
                Pagos registrados
            </h2>

            <span class="total-registros">

                <i class="fa-solid fa-database me-1"></i>

                Total:
                <strong th:text="${#lists.size(pagos)}">0</strong>

            </span>

        </div>

        <div class="table-responsive">

            <table class="table tabla-modulo align-middle">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Reserva</th>
                        <th>Monto</th>
                        <th>Método de pago</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="pago : ${pagos}">

                        <td>

                            <span class="text-secondary">
                                #<span th:text="${pago.idPago}">1</span>
                            </span>

                        </td>

                        <td>

                            <span class="reserva-pago">

                                <i class="fa-solid fa-calendar-check text-secondary"></i>

                                Reserva #<span th:text="${pago.idReserva}">1</span>

                            </span>

                        </td>

                        <td>

                            <span class="monto-pago">
                                ₡<span th:text="${pago.monto}">15000</span>
                            </span>

                        </td>

                        <td>

                            <div class="pago-info">

                                <div class="pago-icono">
                                    <i class="fa-solid fa-credit-card"></i>
                                </div>

                                <strong th:text="${pago.nombreMetodo}">
                                    Efectivo
                                </strong>

                            </div>

                        </td>

                        <td>

                            <span class="badge-estado">

                                <i class="fa-solid fa-circle-check"></i>

                                <span th:text="${pago.nombreEstado}">
                                    Finalizado
                                </span>

                            </span>

                        </td>

                        <td class="text-center">

                            <a th:href="@{/pagos/editar/{id}(id=${pago.idPago})}"
                               class="btn-accion btn-editar"
                               title="Editar pago">

                                <i class="fa-solid fa-pen"></i>

                            </a>

                            <a th:href="@{/pagos/eliminar/{id}(id=${pago.idPago})}"
                               class="btn-accion btn-inactivar"
                               title="Eliminar pago"
                               onclick="return confirm('¿Está seguro de eliminar este pago?')">

                                <i class="fa-solid fa-trash"></i>

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(pagos)}">

                        <td colspan="6"
                            class="sin-registros">

                            <i class="fa-solid fa-money-bill-wave"></i>
                            No hay pagos registrados.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <a th:href="@{/}"
       class="volver-dashboard">

        <i class="fa-solid fa-arrow-left"></i>
        Volver al panel principal

    </a>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
