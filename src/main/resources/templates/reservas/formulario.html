<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${reserva.idReserva == null ? 'Nueva reserva' : 'Editar reserva'}">
        Reserva
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-formulario">

    <section class="encabezado-formulario">

        <h1>
            <i class="fa-solid fa-calendar-check me-2"></i>

            <span th:text="${reserva.idReserva == null ? 'Nueva reserva' : 'Editar reserva'}">
                Nueva reserva
            </span>
        </h1>

        <p th:if="${reserva.idReserva == null}">
            Registrá una nueva reserva de cancha en el sistema.
        </p>

        <p th:if="${reserva.idReserva != null}">
            Modificá la información de la reserva seleccionada.
        </p>

    </section>

    <section class="panel-formulario">

        <div class="titulo-seccion">
            <i class="fa-solid fa-clipboard-list"></i>
            Información de la reserva
        </div>

        <form th:action="${reserva.idReserva == null}
                ? @{/reservas/guardar}
                : @{/reservas/actualizar}"
              th:object="${reserva}"
              method="post">

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="idReserva" class="form-label">
                        ID de reserva
                    </label>

                    <input type="number"
                           id="idReserva"
                           th:field="*{idReserva}"
                           class="form-control"
                           min="1"
                           th:readonly="${reserva.idReserva != null}"
                           required>

                    <div class="form-text"
                         th:if="${reserva.idReserva == null}">
                        El ID debe ser único.
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="fechaReserva" class="form-label">
                        Fecha de reserva
                    </label>

                    <input type="date"
                           id="fechaReserva"
                           th:field="*{fechaReserva}"
                           class="form-control"
                           required>

                </div>

            </div>

            <div class="row">

<div class="col-md-6 mb-4">


    <!-- ADMIN -->
    <div th:if="${session.usuario.rol == 'ADMIN'}">

        <label for="idUsuario" class="form-label">
            Usuario
        </label>

        <select id="idUsuario"
                th:field="*{idUsuario}"
                class="form-select"
                required>

            <option value="">
                Seleccione un usuario
            </option>

            <option th:each="usuario : ${usuarios}"
                    th:value="${usuario.idUsuario}"
                    th:text="${usuario.nombreCompleto}">
                Usuario
            </option>

        </select>

    </div>




    <!-- USUARIO NORMAL -->
    <div th:if="${session.usuario.rol == 'USUARIO'}">

        <label class="form-label">
            Usuario
        </label>


        <input type="text"
               class="form-control"
               th:value="${session.usuario.nombreCompleto}"
               readonly>


        <input type="hidden"
               th:field="*{idUsuario}"
               th:value="${session.usuario.idUsuario}">

    </div>


</div>

                <div class="col-md-6 mb-4">

                    <label for="idEstado" class="form-label">
                        Estado
                    </label>

                    <select id="idEstado"
                            th:field="*{idEstado}"
                            class="form-select"
                            required>

                        <option value="">
                            Seleccione un estado
                        </option>

                        <option th:each="estado : ${estados}"
                                th:value="${estado.idEstado}"
                                th:text="${estado.descripcion}">
                            Activo
                        </option>

                    </select>

                </div>

            </div>

            <div class="mb-4">

                <label for="idHorario" class="form-label">
                    Horario
                </label>

                <select id="idHorario"
                        th:field="*{idHorario}"
                        class="form-select"
                        required>

                    <option value="">
                        Seleccione un horario
                    </option>

                    <option th:each="horario : ${horarios}"
                            th:value="${horario.idHorario}"
                            th:text="${horario.cancha + ' - ' + horario.diaSemana + ' ' + horario.horaInicio + ' - ' + horario.horaFin}">
                        Cancha Central - Lunes 08:00 - 10:00
                    </option>

                </select>

                <div class="form-text">
                    Seleccioná la cancha y el horario disponible para la reserva.
                </div>

            </div>

            <div class="acciones-formulario">

                <a th:href="@{/reservas}"
                   class="btn btn-cancelar">

                    <i class="fa-solid fa-xmark me-2"></i>
                    Cancelar

                </a>

                <button type="submit"
                        class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    <span th:text="${reserva.idReserva == null
                            ? 'Guardar reserva'
                            : 'Actualizar reserva'}">
                        Guardar reserva
                    </span>

                </button>

            </div>

        </form>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
