<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservas - Gestión de Canchas</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">

    <style>
        .reserva-usuario {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .reserva-avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(25, 135, 84, 0.22);
            color: #69ca8d;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .reserva-usuario strong {
            color: white;
            font-size: 0.9rem;
        }

        .reserva-horario {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #dfe6eb;
            font-weight: 500;
        }

        .reserva-fecha {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(13, 110, 253, 0.16);
            color: #8bb8ff;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-modulo">

    <section class="encabezado-modulo">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>

                <h1>
                    <i class="fa-solid fa-calendar-check me-2"></i>
                    Reservas
                </h1>

                <p>
                    Administración y control de las reservas de las canchas.
                </p>

            </div>

            <a th:href="@{/reservas/nuevo}"
               class="btn btn-nuevo">

                <i class="fa-solid fa-plus me-2"></i>
                Nueva reserva

            </a>

        </div>

    </section>

    <section class="panel-tabla">

        <div class="panel-superior">

            <h2>
                <i class="fa-solid fa-calendar-days me-2 text-success"></i>
                Reservas registradas
            </h2>

            <span class="total-registros">

                <i class="fa-solid fa-database me-1"></i>

                Total:
                <strong th:text="${#lists.size(reservas)}">0</strong>

            </span>

        </div>

        <div class="table-responsive">

            <table class="table tabla-modulo align-middle">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Horario</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="reserva : ${reservas}">

                        <td>

                            <span class="text-secondary">
                                #<span th:text="${reserva.idReserva}">1</span>
                            </span>

                        </td>

                        <td>

                            <div class="reserva-usuario">

                                <div class="reserva-avatar">
                                    <i class="fa-solid fa-user"></i>
                                </div>

                                <strong th:text="${reserva.nombreUsuario}">
                                    Usuario
                                </strong>

                            </div>

                        </td>

                        <td>

                            <span class="reserva-horario">

                                <i class="fa-regular fa-clock text-secondary"></i>

                                <span th:text="${reserva.descripcionHorario}">
                                    Lunes 08:00 - 10:00
                                </span>

                            </span>

                        </td>

                        <td>

                            <span class="reserva-fecha">

                                <i class="fa-regular fa-calendar"></i>

                                <span th:text="${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy')}">
                                    20/07/2026
                                </span>

                            </span>

                        </td>

                        <td>

                            <span th:if="${reserva.nombreEstado == 'Activo'}"
                                  class="badge-estado">

                                <i class="fa-solid fa-circle-check"></i>

                                <span th:text="${reserva.nombreEstado}">
                                    Activo
                                </span>

                            </span>

                            <span th:unless="${reserva.nombreEstado == 'Activo'}"
                                  class="badge-secundario">

                                <i class="fa-solid fa-circle-minus"></i>

                                <span th:text="${reserva.nombreEstado}">
                                    Inactivo
                                </span>

                            </span>

                        </td>

                        <td class="text-center">

                            <a th:if="${session.usuario != null and session.usuario.rol == 'ADMIN'}"
                            th:href="@{/reservas/editar/{id}(id=${reserva.idReserva})}"
                               class="btn-accion btn-editar"
                               title="Editar reserva">

                                <i class="fa-solid fa-pen"></i>

                            </a>

                            <a th:if="${session.usuario != null and session.usuario.rol == 'ADMIN'}"
                            th:href="@{/reservas/eliminar/{id}(id=${reserva.idReserva})}"
                               class="btn-accion btn-inactivar"
                               title="Inactivar reserva"
                               onclick="return confirm('¿Está seguro de inactivar esta reserva?');">

                                <i class="fa-solid fa-ban"></i>

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(reservas)}">

                        <td colspan="6"
                            class="sin-registros">

                            <i class="fa-solid fa-calendar-xmark"></i>
                            No hay reservas registradas.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <a th:href="@{/}"
       class="volver-dashboard">

        <i class="fa-solid fa-arrow-left"></i>
        Volver al panel principal

    </a>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
