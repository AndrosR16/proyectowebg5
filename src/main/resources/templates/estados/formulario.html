<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${estado.idEstado == null ? 'Nuevo estado' : 'Editar estado'}">
        Estado
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-formulario">

    <section class="encabezado-formulario">

        <h1>
            <i class="fa-solid fa-circle-check me-2"></i>

            <span th:text="${estado.idEstado == null ? 'Nuevo estado' : 'Editar estado'}">
                Nuevo estado
            </span>
        </h1>

        <p th:if="${estado.idEstado == null}">
            Registrá un nuevo estado para utilizarlo en el sistema.
        </p>

        <p th:if="${estado.idEstado != null}">
            Modificá la información del estado seleccionado.
        </p>

    </section>

    <section class="panel-formulario">

        <div class="titulo-seccion">
            <i class="fa-solid fa-circle-info"></i>
            Información del estado
        </div>

        <form th:action="${estado.idEstado == null}
                        ? @{/estados/guardar}
                        : @{/estados/actualizar}"
              th:object="${estado}"
              method="post">

            <div class="row">

                <div class="col-md-4 mb-4">

                    <label for="idEstado" class="form-label">
                        ID del estado
                    </label>

                    <input type="number"
                           id="idEstado"
                           class="form-control"
                           th:field="*{idEstado}"
                           min="1"
                           th:readonly="${estado.idEstado != null}"
                           required>

                    <div class="form-text"
                         th:if="${estado.idEstado == null}">
                        El ID debe ser único.
                    </div>

                </div>

                <div class="col-md-8 mb-4">

                    <label for="descripcion" class="form-label">
                        Descripción
                    </label>

                    <input type="text"
                           id="descripcion"
                           class="form-control"
                           th:field="*{descripcion}"
                           maxlength="100"
                           placeholder="Ejemplo: Activo"
                           required>

                    <div class="form-text">
                        Indicá el nombre o descripción del estado.
                    </div>

                </div>

            </div>

            <div class="acciones-formulario">

                <a th:href="@{/estados}"
                   class="btn btn-cancelar">

                    <i class="fa-solid fa-xmark me-2"></i>
                    Cancelar

                </a>

                <button type="submit"
                        class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    <span th:text="${estado.idEstado == null
                            ? 'Guardar estado'
                            : 'Actualizar estado'}">
                        Guardar estado
                    </span>

                </button>

            </div>

        </form>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
