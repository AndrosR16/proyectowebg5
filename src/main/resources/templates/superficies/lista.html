<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Superficies - Gestión de Canchas</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">

    <style>
        .superficie-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .superficie-icono {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(25, 135, 84, 0.22);
            color: #69ca8d;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .superficie-info strong {
            color: white;
            font-size: 0.9rem;
        }
    </style>

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-modulo">

    <section class="encabezado-modulo">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>

                <h1>
                    <i class="fa-solid fa-layer-group me-2"></i>
                    Superficies
                </h1>

                <p>
                    Administración de los tipos de superficie disponibles para las canchas.
                </p>

            </div>

            <a th:href="@{/superficies/nuevo}"
               class="btn btn-nuevo">

                <i class="fa-solid fa-plus me-2"></i>
                Nueva superficie

            </a>

        </div>

    </section>

    <section class="panel-tabla">

        <div class="panel-superior">

            <h2>
                <i class="fa-solid fa-layer-group me-2 text-success"></i>
                Superficies registradas
            </h2>

            <span class="total-registros">

                <i class="fa-solid fa-database me-1"></i>

                Total:
                <strong th:text="${#lists.size(superficies)}">0</strong>

            </span>

        </div>

        <div class="table-responsive">

            <table class="table tabla-modulo align-middle">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="superficie : ${superficies}">

                        <td>

                            <span class="text-secondary">
                                #<span th:text="${superficie.idSuperficie}">1</span>
                            </span>

                        </td>

                        <td>

                            <div class="superficie-info">

                                <div class="superficie-icono">
                                    <i class="fa-solid fa-layer-group"></i>
                                </div>

                                <strong th:text="${superficie.descripcion}">
                                    Césped natural
                                </strong>

                            </div>

                        </td>

                        <td>

                            <span th:if="${superficie.idEstado == 1}"
                                  class="badge-estado">

                                <i class="fa-solid fa-circle-check"></i>
                                Activo

                            </span>

                            <span th:if="${superficie.idEstado == 2}"
                                  class="badge-secundario">

                                <i class="fa-solid fa-circle-minus"></i>
                                Inactivo

                            </span>

                        </td>

                        <td class="text-center">

                            <a th:href="@{/superficies/editar/{id}(id=${superficie.idSuperficie})}"
                               class="btn-accion btn-editar"
                               title="Editar superficie">

                                <i class="fa-solid fa-pen"></i>

                            </a>

                            <a th:href="@{/superficies/eliminar/{id}(id=${superficie.idSuperficie})}"
                               class="btn-accion btn-inactivar"
                               title="Eliminar superficie"
                               onclick="return confirm('¿Desea eliminar la superficie?');">

                                <i class="fa-solid fa-ban"></i>

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(superficies)}">

                        <td colspan="4"
                            class="sin-registros">

                            <i class="fa-solid fa-layer-group"></i>
                            No hay superficies registradas.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <a th:href="@{/}"
       class="volver-dashboard">

        <i class="fa-solid fa-arrow-left"></i>
        Volver al panel principal

    </a>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
