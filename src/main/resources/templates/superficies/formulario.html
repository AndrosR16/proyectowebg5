<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${superficie.idSuperficie == null ? 'Nueva superficie' : 'Editar superficie'}">
        Superficie
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-formulario">

    <section class="encabezado-formulario">

        <h1>
            <i class="fa-solid fa-layer-group me-2"></i>

            <span th:text="${superficie.idSuperficie == null ? 'Nueva superficie' : 'Editar superficie'}">
                Nueva superficie
            </span>
        </h1>

        <p th:if="${superficie.idSuperficie == null}">
            Registrá un nuevo tipo de superficie para las canchas.
        </p>

        <p th:if="${superficie.idSuperficie != null}">
            Modificá la información de la superficie seleccionada.
        </p>

    </section>

    <section class="panel-formulario">

        <div class="titulo-seccion">
            <i class="fa-solid fa-layer-group"></i>
            Información de la superficie
        </div>

        <form th:action="${superficie.idSuperficie == null}
                        ? @{/superficies/guardar}
                        : @{/superficies/actualizar}"
              th:object="${superficie}"
              method="post">

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="idSuperficie" class="form-label">
                        ID de superficie
                    </label>

                    <input type="number"
                           id="idSuperficie"
                           class="form-control"
                           th:field="*{idSuperficie}"
                           min="1"
                           th:readonly="${superficie.idSuperficie != null}"
                           required>

                    <div class="form-text"
                         th:if="${superficie.idSuperficie == null}">
                        El ID debe ser único.
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="idEstado" class="form-label">
                        Estado
                    </label>

                    <select id="idEstado"
                            class="form-select"
                            th:field="*{idEstado}"
                            required>

                        <option value="">
                            Seleccione un estado
                        </option>

                        <option th:each="estado : ${estados}"
                                th:value="${estado.idEstado}"
                                th:text="${estado.descripcion}">
                            Activo
                        </option>

                    </select>

                </div>

            </div>

            <div class="mb-4">

                <label for="descripcion" class="form-label">
                    Descripción
                </label>

                <input type="text"
                       id="descripcion"
                       class="form-control"
                       th:field="*{descripcion}"
                       maxlength="100"
                       placeholder="Ejemplo: Césped natural"
                       required>

                <div class="form-text">
                    Indicá el tipo de superficie de la cancha.
                </div>

            </div>

            <div class="acciones-formulario">

                <a th:href="@{/superficies}"
                   class="btn btn-cancelar">

                    <i class="fa-solid fa-xmark me-2"></i>
                    Cancelar

                </a>

                <button type="submit"
                        class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    <span th:text="${superficie.idSuperficie == null
                            ? 'Guardar superficie'
                            : 'Actualizar superficie'}">
                        Guardar superficie
                    </span>

                </button>

            </div>

        </form>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
