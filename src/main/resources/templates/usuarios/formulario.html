<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo}">Formulario de usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-header bg-dark text-white">

                        <h1 class="h4 mb-0" th:text="${titulo}">
                            Formulario de usuario
                        </h1>

                    </div>

                    <div class="card-body">

                        <form th:object="${usuario}" th:action="${usuario.idUsuario == null}
                                ? @{/usuarios/guardar}
                                : @{/usuarios/actualizar}" method="post">

                            <input type="hidden" th:field="*{idUsuario}">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label for="nombre" class="form-label">
                                        Nombre
                                    </label>

                                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                                        maxlength="100" required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label for="apellidoP" class="form-label">
                                        Primer apellido
                                    </label>

                                    <input type="text" id="apellidoP" th:field="*{apellidoP}" class="form-control"
                                        maxlength="100" required>

                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label for="apellidoM" class="form-label">
                                        Segundo apellido
                                    </label>

                                    <input type="text" id="apellidoM" th:field="*{apellidoM}" class="form-control"
                                        maxlength="100">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label for="contrasena" class="form-label">
                                        Contraseña
                                    </label>

                                    <input type="password" id="contrasena" th:field="*{contrasena}" class="form-control"
                                        maxlength="100" th:required="${usuario.idUsuario == null}">

                                    <div class="form-text" th:if="${usuario.idUsuario != null}">
                                        Escriba una contraseña únicamente si desea cambiarla.
                                    </div>

                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label for="rol" class="form-label">
                                        Rol
                                    </label>

                                    <select id="rol" th:field="*{rol}" class="form-select" required>

                                        <option value="">
                                            Seleccione un rol
                                        </option>

                                        <option value="Administrador">
                                            Administrador
                                        </option>

                                        <option value="Cliente">
                                            Cliente
                                        </option>

                                        <option value="Empleado">
                                            Empleado
                                        </option>

                                    </select>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label for="idEstado" class="form-label">
                                        Estado
                                    </label>

                                    <select id="idEstado" th:field="*{idEstado}" class="form-select" required>

                                        <option value="">
                                            Seleccione un estado
                                        </option>

                                        <option th:each="estado : ${estados}" th:value="${estado.idEstado}"
                                            th:text="${estado.descripcion}">
                                            Activo
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-3">

                                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>

                                <button type="submit" class="btn btn-primary">

                                    <span th:text="${usuario.idUsuario == null}
                                            ? 'Guardar usuario'
                                            : 'Actualizar usuario'">
                                        Guardar
                                    </span>

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
