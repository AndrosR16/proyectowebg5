<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo}">Formulario de usuario</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-formulario">

    <section class="encabezado-formulario">

        <h1>
            <i class="fa-solid fa-user-gear me-2"></i>

            <span th:text="${titulo}">
                Formulario de usuario
            </span>
        </h1>

        <p th:if="${usuario.idUsuario == null}">
            Registrá un nuevo usuario en el sistema.
        </p>

        <p th:if="${usuario.idUsuario != null}">
            Modificá la información del usuario seleccionado.
        </p>

    </section>

    <section class="panel-formulario">

        <div class="titulo-seccion">
            <i class="fa-solid fa-id-card"></i>
            Información del usuario
        </div>

        <form th:object="${usuario}"
              th:action="${usuario.idUsuario == null}
                    ? @{/usuarios/guardar}
                    : @{/usuarios/actualizar}"
              method="post">

            <input type="hidden" th:field="*{idUsuario}">

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           class="form-control"
                           maxlength="100"
                           required>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="apellidoP" class="form-label">
                        Primer apellido
                    </label>

                    <input type="text"
                           id="apellidoP"
                           th:field="*{apellidoP}"
                           class="form-control"
                           maxlength="100"
                           required>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="apellidoM" class="form-label">
                        Segundo apellido
                    </label>

                    <input type="text"
                           id="apellidoM"
                           th:field="*{apellidoM}"
                           class="form-control"
                           maxlength="100">

                </div>

                <div class="col-md-6 mb-4">

                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input type="text"
                           id="username"
                           th:field="*{username}"
                           class="form-control"
                           maxlength="100"
                           required>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="contrasena" class="form-label">
                        Contraseña
                    </label>

                    <input type="password"
                           id="contrasena"
                           th:field="*{contrasena}"
                           class="form-control"
                           maxlength="100"
                           th:required="${usuario.idUsuario == null}">

                    <div class="form-text"
                         th:if="${usuario.idUsuario != null}">
                        Dejá este campo vacío si no querés cambiar la contraseña.
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="rol" class="form-label">
                        Rol
                    </label>

                    <select id="rol"
                            th:field="*{rol}"
                            class="form-select"
                            required>

                        <option value="">
                            Seleccione un rol
                        </option>

                        <option value="Administrador">
                            Administrador
                        </option>

                        <option value="Cliente">
                            Cliente
                        </option>

                        <option value="Empleado">
                            Empleado
                        </option>

                    </select>

                </div>

            </div>

            <div class="row" th:if="${usuario.idUsuario != null}">

                <div class="col-md-6 mb-4">

                    <label for="idEstado" class="form-label">
                        Estado
                    </label>

                    <select id="idEstado"
                            th:field="*{idEstado}"
                            class="form-select">

                        <option value="">
                            Seleccione un estado
                        </option>

                        <option th:each="estado : ${estados}"
                                th:value="${estado.idEstado}"
                                th:text="${estado.descripcion}">
                            Activo
                        </option>

                    </select>

                </div>

            </div>

            <div class="acciones-formulario">

                <a th:href="@{/usuarios}"
                   class="btn btn-cancelar">

                    <i class="fa-solid fa-xmark me-2"></i>
                    Cancelar
                </a>

                <button type="submit"
                        class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    <span th:text="${usuario.idUsuario == null}
                            ? 'Guardar usuario'
                            : 'Actualizar usuario'">
                        Guardar usuario
                    </span>

                </button>

            </div>

        </form>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
