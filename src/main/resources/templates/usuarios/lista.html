<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1 class="mb-1">Usuarios</h1>
                <p class="text-muted mb-0">
                    Administración de usuarios registrados
                </p>
            </div>

            <a th:href="@{/usuarios/nuevo}"
               class="btn btn-primary">
                Nuevo usuario
            </a>
        </div>

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre completo</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="usuario : ${usuarios}">

                                <td th:text="${usuario.idUsuario}">
                                    1
                                </td>

                                <td th:text="${usuario.nombreCompleto}">
                                    Nombre completo
                                </td>

                                <td th:text="${usuario.rol}">
                                    Cliente
                                </td>

                                <td>
                                    <span
                                        th:if="${usuario.idEstado == 1}"
                                        class="badge text-bg-success"
                                        th:text="${usuario.nombreEstado}">
                                        Activo
                                    </span>

                                    <span
                                        th:unless="${usuario.idEstado == 1}"
                                        class="badge text-bg-secondary"
                                        th:text="${usuario.nombreEstado}">
                                        Inactivo
                                    </span>
                                </td>

                                <td class="text-center">

                                    <a
                                        th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}"
                                        class="btn btn-warning btn-sm">
                                        Editar
                                    </a>

                                    <a
                                        th:if="${usuario.idEstado == 1}"
                                        th:href="@{/usuarios/inactivar/{id}(id=${usuario.idUsuario})}"
                                        class="btn btn-danger btn-sm"
                                        onclick="return confirm('¿Desea inactivar este usuario?');">
                                        Inactivar
                                    </a>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(usuarios)}">

                                <td colspan="5"
                                    class="text-center text-muted py-4">

                                    No hay usuarios registrados.

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <div class="mt-4">

            <a th:href="@{/}"
               class="btn btn-outline-secondary">
                Volver al inicio
            </a>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
