<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${cancha.idCancha == null ? 'Nueva cancha' : 'Editar cancha'}">
        Formulario de cancha
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offcanvas.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/modulos.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="pagina-formulario">

    <section class="encabezado-formulario">

        <h1>
            <i class="fa-solid fa-futbol me-2"></i>

            <span th:text="${cancha.idCancha == null ? 'Nueva cancha' : 'Editar cancha'}">
                Nueva cancha
            </span>
        </h1>

        <p th:if="${cancha.idCancha == null}">
            Registrá una nueva cancha en el sistema.
        </p>

        <p th:if="${cancha.idCancha != null}">
            Modificá la información de la cancha seleccionada.
        </p>

    </section>

    <section class="panel-formulario">

        <div class="titulo-seccion">
            <i class="fa-solid fa-clipboard-list"></i>
            Información de la cancha
        </div>

        <div th:if="${error}"
             class="alert alert-error"
             th:text="${error}">
        </div>

        <form th:action="@{/canchas/guardar}"
              th:object="${cancha}"
              method="post"
              novalidate>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="idCancha" class="form-label">
                        ID de la cancha
                    </label>

                    <input type="number"
                           id="idCancha"
                           th:field="*{idCancha}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('idCancha')} ? ' is-invalid' : ''"
                           min="1"
                           th:readonly="${cancha.idCancha != null}">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('idCancha')}"
                         th:errors="*{idCancha}">
                    </div>

                    <div class="form-text">
                        El ID debe ser único.
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="nombreCancha" class="form-label">
                        Nombre de la cancha
                    </label>

                    <input type="text"
                           id="nombreCancha"
                           th:field="*{nombreCancha}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('nombreCancha')} ? ' is-invalid' : ''"
                           maxlength="100">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('nombreCancha')}"
                         th:errors="*{nombreCancha}">
                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="capacidad" class="form-label">
                        Capacidad
                    </label>

                    <input type="number"
                           id="capacidad"
                           th:field="*{capacidad}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('capacidad')} ? ' is-invalid' : ''"
                           min="1">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('capacidad')}"
                         th:errors="*{capacidad}">
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="precioHora" class="form-label">
                        Precio por hora
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            ₡
                        </span>

                        <input type="number"
                               id="precioHora"
                               th:field="*{precioHora}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('precioHora')} ? ' is-invalid' : ''"
                               min="0.01"
                               step="0.01">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('precioHora')}"
                             th:errors="*{precioHora}">
                        </div>

                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label for="idSuperficie" class="form-label">
                        Superficie
                    </label>

                    <select id="idSuperficie"
                            th:field="*{idSuperficie}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('idSuperficie')} ? ' is-invalid' : ''">

                        <option value="">
                            Seleccione una superficie
                        </option>

                        <option th:each="superficie : ${superficies}"
                                th:value="${superficie.idSuperficie}"
                                th:text="${superficie.descripcion}">
                        </option>

                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('idSuperficie')}"
                         th:errors="*{idSuperficie}">
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label for="idEstado" class="form-label">
                        Estado
                    </label>

                    <select id="idEstado"
                            th:field="*{idEstado}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('idEstado')} ? ' is-invalid' : ''">

                        <option value="">
                            Seleccione un estado
                        </option>

                        <option th:each="estado : ${estados}"
                                th:value="${estado.idEstado}"
                                th:text="${estado.descripcion}">
                        </option>

                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('idEstado')}"
                         th:errors="*{idEstado}">
                    </div>

                </div>

            </div>

            <div class="acciones-formulario">

                <a th:href="@{/canchas}"
                   class="btn btn-cancelar">

                    <i class="fa-solid fa-xmark me-2"></i>
                    Cancelar
                </a>

                <button type="submit"
                        class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    <span th:text="${cancha.idCancha == null ? 'Guardar cancha' : 'Guardar cambios'}">
                        Guardar cancha
                    </span>

                </button>

            </div>

        </form>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
